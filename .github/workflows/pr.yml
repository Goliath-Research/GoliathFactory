name: PR

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Semantic catalog export check
        run: |
          goliath-factory-semantic-export --check schemas/semantic/catalog.json \
            --row-types database/schema/portal_semantic_row_types.sql

      - name: Pyrefly
        run: pyrefly check

      - name: Unit tests
        run: pytest -q
