<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Factory · Receiving</title>
    <link rel="stylesheet" href="../static/mfg-shell.css" />
  </head>
  <body>
    <h1>Receiving (pilot stub)</h1>
    <p class="mfg-muted">
      Full receiving and incoming inspection integrate with the GoliathApp <code>inv</code> module when
      <a href="https://github.com/Goliath-Research/GoliathApp/pull/34">PR #34</a> merges. This form calls
      <code>mfg.inv.receive_stub</code> to exercise the hook.
    </p>
    <form id="recvForm" class="mfg-card mfg-form-grid">
      <label>Item ref <input name="item_ref" required value="RAW-AL-6061" /></label>
      <label>Quantity <input name="quantity" type="number" step="any" required value="100" /></label>
      <label>Supplier lot <input name="lot_number" value="HEAT-88421" /></label>
      <button class="primary" type="submit">Receive (stub)</button>
    </form>
    <pre class="mfg-card" id="out" hidden></pre>
    <p class="mfg-status" id="status"></p>
    <script src="../static/mfg-api.js"></script>
    <script>
      const status = document.getElementById("status");
      document.getElementById("recvForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = new FormData(event.target);
        try {
          const out = await MfgPortal.runAction("mfg.inv.receive_stub", {
            site_id: MfgPortal.siteId(),
            item_ref: String(data.get("item_ref")),
            quantity: Number(data.get("quantity")),
            lot_number: String(data.get("lot_number") || "") || null,
          });
          document.getElementById("out").hidden = false;
          document.getElementById("out").textContent = JSON.stringify(out, null, 2);
          MfgPortal.setStatus(status, "Stub receive recorded — wire to inv when merged");
        } catch (err) {
          MfgPortal.setStatus(status, err.message, true);
        }
      });
    </script>
  </body>
</html>
