<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Factory · Receiving</title>
    <link rel="stylesheet" href="../static/mfg-shell.css" />
  </head>
  <body>
    <h1>Receiving</h1>
    <p>
      Calls <code>inv.stock.receive</code> (Factory override) → <code>inv.sp_stock_receive</code> plus a
      <code>fac_trace</code> material lot for genealogy.
    </p>
    <form id="recvForm" class="mfg-card mfg-form-grid">
      <label>PO line ID <input name="po_line_id" type="number" required value="1" /></label>
      <label>Bin ID <input name="bin_id" type="number" required value="1" /></label>
      <label>Quantity <input name="qty" type="number" step="any" required value="100" /></label>
      <label>Supplier lot <input name="lot_number" value="HEAT-88421" /></label>
      <label>Site ID (trace lot) <input name="site_id" type="number" value="1" /></label>
      <button class="primary" type="submit">Receive stock</button>
    </form>
    <pre class="mfg-card" id="out" hidden></pre>
    <p class="mfg-status" id="status"></p>
    <script src="../static/mfg-api.js"></script>
    <script>
      const status = document.getElementById("status");
      document.getElementById("recvForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = new FormData(event.target);
        try {
          const out = await MfgPortal.runAction("inv.stock.receive", {
            organization_id: MfgPortal.organizationId(),
            user_id: MfgPortal.userId(),
            po_line_id: Number(data.get("po_line_id")),
            bin_id: Number(data.get("bin_id")),
            qty: Number(data.get("qty")),
            lot_number: String(data.get("lot_number") || "") || null,
            site_id: Number(data.get("site_id")) || MfgPortal.siteId(),
          });
          document.getElementById("out").hidden = false;
          document.getElementById("out").textContent = JSON.stringify(out, null, 2);
          MfgPortal.setStatus(status, "Receipt posted to inv + trace lot");
        } catch (err) {
          MfgPortal.setStatus(status, err.message, true);
        }
      });
    </script>
  </body>
</html>
