[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "goliath-factory"
version = "0.1.0"
description = "GoliathApp specialization for manufacturing operations (core data, semantic registry, actions)."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [{ name = "Goliath Research" }]
keywords = ["manufacturing", "mfg", "quality", "goliath"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "pydantic>=2.6.0,<3.0.0",
  "psycopg[binary]>=3.1.0,<4.0.0",
  "methyl-gateway @ git+https://github.com/Goliath-Research/GoliathApp.git@1a0fe269978e99131d7971bb74be5add4bf1ab1e#subdirectory=workflow_engine",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyrefly>=1.3.2,<2"]

[project.scripts]
goliath-factory-semantic-export = "goliath_factory.semantic.export:main"
goliath-factory-seed-semantic = "goliath_factory.seed.semantic_catalog:main"
goliath-factory-seed-nav = "goliath_factory.seed.nav_tree:main"

[project.entry-points."goliath.action_catalogs"]
mfg = "goliath_factory.actions.catalog:ACTIONS"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/goliath_factory"]

[tool.pyrefly]
project-includes = ["src/goliath_factory", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.black]
line-length = 100
target-version = ["py310"]
